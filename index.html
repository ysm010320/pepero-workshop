<!doctype html>
<html lang="ko">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">

<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}html{height:100%}body{margin:0;font-size:14px}</style>
<title>빼빼로 공방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen 3D kitchen. Header (zone tabs) / hint line / 3D stage / tool palette, stacked. Dusky single-look theme. */
:root{
  color-scheme:dark;
  --plum:#3b2a36;
  --plum-deep:#2a1d27;
  --panel:#4d3746;
  --panel-hi:#644a5a;
  --ink:#ffeede;
  --ink-soft:#d9b9b4;
  --amber:#ffb35c;
  --rose:#ff7d9c;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--plum-deep);
  color:var(--ink);
  font-family:var(--body);
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.app{touch-action:none;width:100%;max-width:1100px;height:100%;display:flex;flex-direction:column;gap:7px;min-height:0}
.top{display:flex;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:21px;margin:0;color:var(--amber);white-space:nowrap}
.zones{display:flex;gap:4px;flex:1;min-width:0;justify-content:center}
.zones button{font-family:var(--display);font-size:14px;border:0;padding:0 11px;min-height:36px;border-radius:999px;background:var(--panel);color:var(--ink-soft);white-space:nowrap;cursor:pointer;touch-action:manipulation}
.zones button.now{background:var(--amber);color:var(--plum-deep)}
.snd{font-family:var(--display);font-size:13px;border:0;border-radius:999px;background:var(--panel);color:var(--ink);padding:0 10px;min-height:36px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.guide{background:var(--panel);border-radius:14px;padding:8px 14px}
.guide p{margin:0;font-family:var(--display);font-size:16px;line-height:1.35;text-wrap:balance}
.wrap{flex:1;min-height:0;position:relative;border-radius:20px;overflow:hidden;background:var(--plum);box-shadow:0 10px 30px rgba(0,0,0,.45)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(42,29,39,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.start .card{background:var(--panel);border-radius:22px;padding:22px 22px 18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.start h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--amber)}
.start p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-soft)}
.start .btns{display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-size:18px;border:0;border-radius:999px;min-height:50px;padding:0 22px;cursor:pointer;touch-action:manipulation;background:var(--rose);color:var(--plum-deep)}
.big.alt{background:var(--panel-hi);color:var(--ink)}
#installHelp{font-size:14px;color:var(--ink);background:var(--plum);border-radius:12px;padding:10px 12px;text-align:left}
.palette{display:flex;flex-wrap:wrap;align-items:center;gap:7px;min-height:46px}
.palette .lab{font-family:var(--display);font-size:13px;color:var(--ink-soft)}
.chip{font-family:var(--display);font-size:15px;border:2px solid transparent;background:var(--panel);color:var(--ink);border-radius:999px;min-height:44px;padding:0 13px 0 9px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;touch-action:manipulation}
.chip .sw{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,238,222,.3);flex:none}
.chip.round{padding:0;width:44px;justify-content:center}
.chip.on{border-color:var(--amber);background:var(--panel-hi)}
.chip.plain{padding:0 14px}
.next{margin-left:auto;font-family:var(--display);font-size:17px;border:0;border-radius:999px;min-height:46px;padding:0 22px;background:var(--rose);color:var(--plum-deep);cursor:pointer;touch-action:manipulation}
.next:disabled{background:var(--panel);color:var(--ink-soft);cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:520px){
  h1{font-size:17px}
  .zones button{font-size:12px;padding:0 8px;min-height:34px}
  .snd{font-size:12px;padding:0 8px;min-height:34px}
  .guide p{font-size:14px}
  .chip{min-height:40px;font-size:14px}
  .chip.round{width:40px}
}
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <h1>빼빼로 공방</h1>
    <nav class="zones" id="zones" aria-label="주방 자리">
      <button type="button" data-zone="0">물·초콜릿</button>
      <button type="button" data-zone="1">만들기</button>
      <button type="button" data-zone="2">꾸미기</button>
      <button type="button" data-zone="3">포장</button>
    </nav>
    <button class="snd" id="snd" type="button" aria-pressed="true">소리 켬</button>
  </div>
  <div class="guide"><p id="hint">초콜릿 청크를 컵에 걸친 비닐 짤주머니에 담아요</p></div>
  <div class="wrap" id="wrap">
    <canvas id="stage" aria-label="빼빼로 만들기 3D 주방"></canvas>
    <div class="start" id="start">
      <div class="card">
        <h2>빼빼로 공방</h2>
        <p>물을 받고, 초콜릿을 녹이고, 과자를 끼워 푹 담가요. 정해진 순서 없이 마음대로 만들어요.</p>
        <div class="btns">
          <button class="big" id="playWeb" type="button">웹에서 바로 플레이</button>
          <button class="big alt" id="install" type="button">앱으로 설치</button>
        </div>
        <div id="installHelp" hidden></div>
      </div>
    </div>
  </div>
  <div class="palette" id="palette"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
